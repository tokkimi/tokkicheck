<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="20" y="16" width="260" height="368" rx="28" fill="#ffffff" stroke="#ef4444" stroke-width="4" filter="url(#shadow2)"/>
  <text x="150" y="50" font-size="20" font-weight="800" fill="#111827" text-anchor="middle" font-family="sans-serif">영양성분표</text>
  <line x1="34" y1="62" x2="266" y2="62" stroke="#111827" stroke-width="2"/>
  <text x="34" y="84" font-size="13" fill="#374151" font-family="sans-serif">1회 제공량 125g 기준</text>
  <line x1="34" y1="92" x2="266" y2="92" stroke="#e5e7eb"/>
  <text x="34" y="114" font-size="14" fill="#111827" font-family="sans-serif">열량</text>
  <text x="266" y="114" font-size="14" fill="#111827" text-anchor="end" font-family="sans-serif">505 kcal</text>
  <text x="34" y="136" font-size="13" fill="#374151" font-family="sans-serif">탄수화물</text>
  <text x="266" y="136" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">79 g</text>
  <text x="34" y="156" font-size="13" fill="#374151" font-family="sans-serif">  당류</text>
  <text x="266" y="156" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">3 g</text>
  <text x="34" y="176" font-size="13" fill="#374151" font-family="sans-serif">단백질</text>
  <text x="266" y="176" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">10 g</text>
  <text x="34" y="196" font-size="13" fill="#374151" font-family="sans-serif">지방</text>
  <text x="266" y="196" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">16 g</text>
  <text x="34" y="216" font-size="13" fill="#374151" font-family="sans-serif">나트륨</text>
  <text x="266" y="216" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">1790 mg</text>
  <line x1="34" y1="228" x2="266" y2="228" stroke="#e5e7eb"/>
  <text x="34" y="248" font-size="12" font-weight="700" fill="#111827" font-family="sans-serif">원재료명</text>
  <text x="34" y="266" font-size="11.5" fill="#4b5563" font-family="sans-serif"><tspan x="34" dy="0">면(밀가루, 팜유), 된장분말스</tspan><tspan x="34" dy="18">프, 건조야채</tspan></text>
  <text x="34" y="356" font-size="12" font-weight="700" fill="#b91c1c" font-family="sans-serif">알레르기 정보</text>
  <text x="34" y="374" font-size="11.5" fill="#b91c1c" font-family="sans-serif">밀, 대두 함유</text>
  <text x="34" y="390" font-size="10" fill="#6b7280" font-family="sans-serif">제조국: 대한민국</text>
</svg>