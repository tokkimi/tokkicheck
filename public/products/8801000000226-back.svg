<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="20" y="16" width="260" height="368" rx="28" fill="#ffffff" stroke="#84cc16" stroke-width="4" filter="url(#shadow2)"/>
  <text x="150" y="50" font-size="20" font-weight="800" fill="#111827" text-anchor="middle" font-family="sans-serif">영양성분표</text>
  <line x1="34" y1="62" x2="266" y2="62" stroke="#111827" stroke-width="2"/>
  <text x="34" y="84" font-size="13" fill="#374151" font-family="sans-serif">1회 제공량 100g 기준</text>
  <line x1="34" y1="92" x2="266" y2="92" stroke="#e5e7eb"/>
  <text x="34" y="114" font-size="14" fill="#111827" font-family="sans-serif">열량</text>
  <text x="266" y="114" font-size="14" fill="#111827" text-anchor="end" font-family="sans-serif">90 kcal</text>
  <text x="34" y="136" font-size="13" fill="#374151" font-family="sans-serif">탄수화물</text>
  <text x="266" y="136" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">18 g</text>
  <text x="34" y="156" font-size="13" fill="#374151" font-family="sans-serif">  당류</text>
  <text x="266" y="156" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">12 g</text>
  <text x="34" y="176" font-size="13" fill="#374151" font-family="sans-serif">단백질</text>
  <text x="266" y="176" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">3 g</text>
  <text x="34" y="196" font-size="13" fill="#374151" font-family="sans-serif">지방</text>
  <text x="266" y="196" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">0.5 g</text>
  <text x="34" y="216" font-size="13" fill="#374151" font-family="sans-serif">나트륨</text>
  <text x="266" y="216" font-size="13" fill="#374151" text-anchor="end" font-family="sans-serif">2900 mg</text>
  <line x1="34" y1="228" x2="266" y2="228" stroke="#e5e7eb"/>
  <text x="34" y="248" font-size="12" font-weight="700" fill="#111827" font-family="sans-serif">원재료명</text>
  <text x="34" y="266" font-size="11.5" fill="#4b5563" font-family="sans-serif"><tspan x="34" dy="0">굴추출물, 설탕, 전분, 캐러멜색</tspan><tspan x="34" dy="18">소</tspan></text>
  <text x="34" y="356" font-size="12" font-weight="700" fill="#b91c1c" font-family="sans-serif">알레르기 정보</text>
  <text x="34" y="374" font-size="11.5" fill="#b91c1c" font-family="sans-serif">굴(조개류) 함유</text>
  <text x="34" y="392" font-size="11" fill="#374151" font-family="sans-serif">제조국:</text>
  <svg x="68" y="382" width="20" height="14" viewBox="0 0 30 20"><rect width="30" height="20" fill="#de2910"/><circle cx="7" cy="6" r="2.4" fill="#ffde00"/></svg>
</svg>